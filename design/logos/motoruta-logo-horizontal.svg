<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 212 64" role="img" aria-label="Motoruta">
  <title>Motoruta — logo horizontal</title>
  <desc>Isotipo + logotipo, alineados a la altura de las mayúsculas. El texto usa Sora; para impresión o empaquetado conviene convertir el texto a trazos.</desc>

  <defs>
    <mask id="mr-lockup-casco">
      <rect width="64" height="64" fill="#fff"/>
      <path d="M20.4 25h23.2c1.9 0 3.4 1.5 3.4 3.4v7.2c0 1.9-1.5 3.4-3.4 3.4H20.4c-1.9 0-3.4-1.5-3.4-3.4v-7.2c0-1.9 1.5-3.4 3.4-3.4Z" fill="#000"/>
      <path d="M26.5 46.6h11c0 4.6-2.5 8.4-5.5 8.4s-5.5-3.8-5.5-8.4Z" fill="#000"/>
    </mask>
  </defs>

  <!-- Isotipo, escala al 88% y centrado con el texto -->
  <g fill="currentColor" transform="translate(22 32) scale(0.88) translate(-32 -32)">
    <rect x="0" y="24" width="9" height="4.2" rx="2.1" opacity="0.45"/>
    <rect x="0" y="31.8" width="13.5" height="4.2" rx="2.1" opacity="0.85"/>
    <rect x="0" y="39.6" width="7" height="4.2" rx="2.1" opacity="0.35"/>
    <path mask="url(#mr-lockup-casco)" d="M13 32.4C13 17.6 21.1 9 32 9s19 8.6 19 23.4V43c0 6.6-5.4 12-12 12H25c-6.6 0-12-5.4-12-12V32.4Z"/>
  </g>

  <!-- Logotipo -->
  <text x="64" y="42.5" fill="currentColor"
        font-family="Sora, Inter, system-ui, -apple-system, sans-serif"
        font-size="31" font-weight="600" letter-spacing="-0.8">Motoruta</text>
</svg>
