<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Motoruta">
  <title>Motoruta — variante: monograma M con carretera</title>
  <desc>Monograma abstracto: la M de Motoruta trazada como una carretera que se aleja, con línea de velocidad.</desc>

  <g fill="none" stroke="currentColor" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- M como carretera -->
    <path d="M10 48V22l11 14 11-14v26"/>
  </g>

  <!-- Líneas de velocidad -->
  <g fill="currentColor">
    <rect x="40" y="24" width="16" height="5" rx="2.5" opacity="0.85"/>
    <rect x="44" y="34" width="12" height="5" rx="2.5" opacity="0.5"/>
    <rect x="48" y="44" width="8" height="5" rx="2.5" opacity="0.3"/>
  </g>
</svg>
