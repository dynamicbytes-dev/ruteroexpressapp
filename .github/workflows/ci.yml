name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Laravel + PostGIS)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: motoruta_testing
          POSTGRES_USER: motoruta
          POSTGRES_PASSWORD: secret
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U motoruta -d motoruta_testing"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Preparar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_pgsql, pgsql, bcmath, intl, gd, zip, curl
          coverage: none

      - name: Instalar dependencias
        working-directory: backend
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Preparar entorno
        working-directory: backend
        run: |
          cp .env.example .env
          php artisan key:generate --force
          php artisan config:clear

      - name: Ejecutar pruebas
        working-directory: backend
        run: php artisan test

  mobile:
    name: Móvil (Flutter)
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Preparar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: stable
          cache: true

      - name: Instalar dependencias
        working-directory: mobile
        run: flutter pub get

      - name: Analizar código
        working-directory: mobile
        run: flutter analyze

      - name: Ejecutar pruebas
        working-directory: mobile
        run: flutter test
