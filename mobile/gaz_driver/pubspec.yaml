name: gaz_driver
description: "GAZ Driver: plataforma de viajes para conductores"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.6
  provider: ^6.1.5+1

  # Notificaciones push. Si el proyecto de Firebase no está configurado para
  # este paquete, la app sigue funcionando con WebSocket y sondeo.
  firebase_core: ^4.7.0
  firebase_messaging: ^16.2.0

  gaz_core:
    path: ../gaz_core

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
